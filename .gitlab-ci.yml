default:
  interruptible: true

# v2.0.0 catalog: auto-cancel build/test on superseded MR pushes;
# release-stage jobs (template-side interruptible: false) continue.
# on_job_failure: all stops the pipeline the moment a release-blocking
# job fails so we don't keep signing/uploading after a fail.
#
# workflow.rules: prevent duplicate pipelines. When a branch has an
# open MR, suppress the redundant push pipeline and let the
# merge_request_event pipeline be the only pipeline for that commit
# (Renovate pushes land on a branch that already has an open MR, which
# otherwise fires BOTH a push and an MR-event pipeline for the same
# commit). Mirrors dunn.dev/othala's fix for the same defect.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    # A scheduled pipeline keeps running every job when one fails, so
    # an unrelated red job cannot cancel the weekly drift gate.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      auto_cancel:
        on_job_failure: none
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all

stages:
  - lint
  - test
  - build
  - drift-gate
  - package
  - release
  - deploy
  - verdict
  - automerge-gate

variables:
  GOFLAGS: -mod=readonly

# Everything except drift-gate lives in one file that scheduled
# pipelines skip, so the weekly run is the drift gate and nothing else.
include:
  - local: .gitlab/ci/pipeline.yml
    rules:
      - if: $CI_PIPELINE_SOURCE != "schedule"

# Drift gate. Builds bairn, logs in with FAMLY_EMAIL and
# FAMLY_PASSWORD (masked, protected project variables), reads the
# manifest's two endpoints from the operator's own account, and
# diffs response shapes against the committed baseline at
# discovery/baselines/main/. Exit 1 means the shape changed, exit 2
# means login or transport failed; either fails the pipeline, so a
# tag does not ship a binary that no longer matches Famly and the
# schedule owner is emailed.
#
# Fires on every tag and on the weekly schedule on main, where it is
# the only job (the rest sit behind the include rule above). See
# discovery/baselines/main/README.md and
# docs/decisions/0007-llm-augmented-ci.md for the posture.
#
# The fresh shapes are kept as an artifact so the baseline can be
# reseeded without local credentials: they carry type names and <n=*>
# only, the same content as the committed baseline.
drift-gate:
  stage: drift-gate
  image: registry.gitlab.com/dunn.dev/pipeline/ci-go:4.8.0@sha256:8a28513a9ad191e0880c585baa31f31e533c5288561c369c634782e74066804a
  interruptible: false
  script:
    - go build -o bin/bairn ./cmd/bairn
    - bin/bairn drift --anonymize --manifest discovery/probe/manifest.toml --diff discovery/baselines/main
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - discovery/baselines/current/
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
