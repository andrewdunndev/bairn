default:
  interruptible: true

# v2.0.0 catalog: auto-cancel build/test on superseded MR pushes;
# release-stage jobs (template-side interruptible: false) continue.
# on_job_failure: all stops the pipeline the moment a release-blocking
# job fails so we don't keep signing/uploading after a fail.
#
# workflow.rules: prevent duplicate pipelines. When a branch has an
# open MR, suppress the redundant push pipeline and let the
# merge_request_event pipeline be the only pipeline for that commit
# (Renovate pushes land on a branch that already has an open MR, which
# otherwise fires BOTH a push and an MR-event pipeline for the same
# commit). Mirrors dunn.dev/othala's fix for the same defect.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all

stages:
  - lint
  - test
  - build
  - drift-gate
  - package
  - release
  - deploy
  - verdict
  - automerge-gate

variables:
  GOFLAGS: -mod=readonly

# Every include skips scheduled pipelines, so the weekly schedule runs
# drift-gate alone and a failure email means Famly drifted. The local
# file holds the rule overrides for lint, audit and test.
include:
  - component: gitlab.com/dunn.dev/pipeline/osv-verdict@4
    rules: &not-schedule
      - if: $CI_PIPELINE_SOURCE != "schedule"
  - component: gitlab.com/dunn.dev/pipeline/automerge-gate@4
    rules: *not-schedule
    inputs:
      stage: automerge-gate
      required-checks: "osv"

  # Lint-stage golangci-lint via the catalog's pinned ci-go. Real
  # gate (no allow_failure). The previous bespoke
  # docker.io/golangci/golangci-lint:latest-alpine path forced
  # allow_failure to absorb rate-cap pull flakes; that workaround
  # was masking real lint hits.
  - component: gitlab.com/dunn.dev/pipeline/go-lint@4
    rules: *not-schedule

  # Lint-stage govulncheck. Allow_failure by default (vuln-DB
  # shifts shouldn't block a release).
  - component: gitlab.com/dunn.dev/pipeline/go-audit@4
    rules: *not-schedule

  # dunn.dev/reference conformance check (lint stage, runs before
  # build). Enforcing: all seven contracts passed clean in advisory
  # mode, so a violation now fails the pipeline.
  - component: gitlab.com/dunn.dev/pipeline/reference-check@4
    rules: *not-schedule
    inputs:
      reference_ref: main
      fail_on_violation: true

  # Branch verification: parallel:matrix cross-compile on every
  # push (linux/amd64, linux/arm64, darwin/arm64). Module-cached.
  # Skipped on tag pipelines (go-release-binary supersedes).
  - component: gitlab.com/dunn.dev/pipeline/go-build@4
    rules: *not-schedule
    inputs:
      job_name: go-build
      binary_name: bairn
      package_path: ./cmd/bairn

  # Tag-only: parallel:matrix cross-compile + per-binary cosign
  # signature + per-binary .sha256 + upload to package registry.
  - component: gitlab.com/dunn.dev/pipeline/go-release-binary@4
    rules: *not-schedule
    inputs:
      binary_name: bairn
      package_path: ./cmd/bairn
      package_name: bairn

  # Tag-only: CycloneDX SBOM per binary via syft.
  - component: gitlab.com/dunn.dev/pipeline/go-sbom@4
    rules: *not-schedule
    inputs:
      package_name: bairn

  # Tag-only: SLSA v1.0 provenance per binary, cosign-signed via
  # GitLab OIDC keyless.
  - component: gitlab.com/dunn.dev/pipeline/slsa-attest@4
    rules: *not-schedule

  # Tag-only: GitLab Release with binaries + SBOMs + attestations
  # linked. Idempotent across pipeline reruns.
  - component: gitlab.com/dunn.dev/pipeline/release-create@4
    rules: *not-schedule
    inputs:
      package_name: bairn
      release_title: "bairn $CI_COMMIT_TAG"

  # Container build: ships an OCI image alongside each tagged
  # release at registry.gitlab.com/dunn.dev/bairn/cli:vX.Y.Z.
  #
  # from_artifacts: true means the Containerfile is a thin runtime
  # layer that COPYs the already-built, cosign-signed binary from
  # go-release-binary's dist/ output. Provable byte-for-byte parity
  # between the binary verifiable via cosign verify-blob and the
  # one running inside the container.
  #
  # multi_arch: false in v0.5.0 (storr runner's qemu-user-static
  # support is unverified; flipping to true in v0.5.1 after confirming).
  # Apple Silicon / Graviton users can still run via emulation
  # against the amd64 image; flipping to multi_arch: true means
  # native-arch images, no emulation overhead.
  #
  # sign_image: true cosign-signs the pushed image by digest.
  - component: gitlab.com/dunn.dev/pipeline/container-image@4
    rules: *not-schedule
    inputs:
      containerfile: Containerfile
      image_tag: cli
      stage: package
      tag_pipeline: true
      from_artifacts: true
      multi_arch: false
      sign_image: true

  # One-pager site at bairn.dunn.dev. Astro static build under web/,
  # shipped as a Cloudflare Worker with bound static assets. Build
  # runs on every push + MR; deploy runs only on main. Custom-domain
  # binding to bairn.dunn.dev is configured in wrangler.toml; the
  # zone-side DNS record needs to exist before the first deploy.
  - component: gitlab.com/dunn.dev/pipeline/cloudflare-worker@4
    rules: *not-schedule
    inputs:
      wrangler_config: web/wrangler.toml
      build_command: npm run build
      output_dir: web/dist
      needs_npm_install: true
      npm_dir: web
      production_url: https://bairn.dunn.dev
  - local: .gitlab/ci/pipeline.yml
    rules: *not-schedule

# Drift gate. Builds bairn, logs in with FAMLY_EMAIL and
# FAMLY_PASSWORD (masked, protected project variables), reads the
# manifest's two endpoints from the operator's own account, and
# diffs response shapes against the committed baseline at
# discovery/baselines/main/. Exit 1 means the shape changed, exit 2
# means login or transport failed; either fails the pipeline, so a
# tag does not ship a binary that no longer matches Famly and the
# schedule owner is emailed.
#
# Fires on every tag and on the weekly schedule on main, where it is
# the only job (every include above skips schedules). See
# discovery/baselines/main/README.md and
# docs/decisions/0007-llm-augmented-ci.md for the posture.
#
# The fresh shapes are kept as an artifact so the baseline can be
# reseeded without local credentials: they carry type names and <n=*>
# only, the same content as the committed baseline.
drift-gate:
  stage: drift-gate
  image: registry.gitlab.com/dunn.dev/pipeline/ci-go:4.8.0@sha256:8a28513a9ad191e0880c585baa31f31e533c5288561c369c634782e74066804a
  interruptible: false
  script:
    - go build -o bin/bairn ./cmd/bairn
    - bin/bairn drift --anonymize --manifest discovery/probe/manifest.toml --diff discovery/baselines/main
  artifacts:
    access: developer
    when: always
    expire_in: 1 week
    paths:
      - discovery/baselines/current/
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
